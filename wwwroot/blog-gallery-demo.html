<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airborne Blogs & Gallery API Test</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#f4f6fa;color:#1f2937}
    h1{margin-top:0}.section{margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}.card img{width:100%;height:170px;object-fit:cover;background:#e5e7eb}.body{padding:16px}.muted{color:#64748b;font-size:13px}.message{padding:12px;background:#fff;border-radius:8px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Airborne Aviation — Blogs & Gallery</h1>
  <p class="muted">This page checks the public API endpoints on the same backend.</p>
  <section class="section"><h2>Latest Blogs</h2><div id="blogs" class="grid"><p>Loading blogs…</p></div></section>
  <section class="section"><h2>Gallery</h2><div id="gallery" class="grid"><p>Loading gallery…</p></div></section>
  <p id="status" class="message" role="status"></p>
<script>
async function getJson(url){const r=await fetch(url);if(!r.ok)throw new Error(`${url} returned HTTP ${r.status}`);return r.json()}
function makeCard(title,description,imageUrl,meta){const card=document.createElement('article');card.className='card';if(imageUrl){const img=document.createElement('img');img.src=imageUrl;img.alt=title;img.loading='lazy';img.onerror=()=>img.remove();card.appendChild(img)}const body=document.createElement('div');body.className='body';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=description||'';const m=document.createElement('p');m.className='muted';m.textContent=meta||'';body.append(h,p,m);card.appendChild(body);return card}
(async()=>{const status=document.getElementById('status');try{const [blogs,gallery]=await Promise.all([getJson('/api/Blog'),getJson('/api/Gallery')]);const blogRoot=document.getElementById('blogs');blogRoot.replaceChildren();if(!blogs.length)blogRoot.textContent='No published blogs yet. Add a post using POST /api/Blog with the X-Admin-Key header.';blogs.forEach(b=>blogRoot.appendChild(makeCard(b.title,b.excerpt,b.imageUrl,`${b.category||'Blog'} · ${b.author||''}`)));const galleryRoot=document.getElementById('gallery');galleryRoot.replaceChildren();if(!gallery.length)galleryRoot.textContent='No active gallery images found. Upload an image using POST /api/Media/upload.';gallery.forEach(g=>galleryRoot.appendChild(makeCard(g.mediaName,'',g.mediaUrl,'Gallery image')));status.textContent=`API connected. Blogs: ${blogs.length}. Gallery images: ${gallery.length}.`}catch(e){status.textContent='API request failed: '+e.message}})();
</script>
</body>
</html>
